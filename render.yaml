# Render Blueprint: the web service, built from the Dockerfile.
# The database is PostgreSQL on Supabase (see README, "Deploy"). Secrets are
# marked `sync: false`, so Render asks for them and they never live in this file.
services:
  - type: web
    name: prompt-manager
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Supabase session pooler (IPv4), e.g.
      # Host=aws-0-eu-central-1.pooler.supabase.com;Port=5432;Database=postgres;
      # Username=<role>.<project-ref>;Password=...;SSL Mode=Require
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Render terminates HTTPS at its proxy; trust X-Forwarded-* so the app
      # sees https (secure cookies, correct redirect URLs).
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # Port the container listens on (see Dockerfile).
      - key: PORT
        value: "8080"
      # Accounts registered with this address become admins.
      - key: Auth__AdminEmails__0
        sync: false
      # Optional: without it only the offline echo model is available.
      - key: ANTHROPIC_API_KEY
        sync: false
