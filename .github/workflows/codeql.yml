name: CodeQL

# Static analysis for security problems in the C# code. Findings appear under
# the repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # C# can be analysed from source alone, so no build step is needed.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
