name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore PromptManager.slnx

      - name: Build
        run: dotnet build PromptManager.slnx --no-restore --configuration Release -warnaserror

      - name: Install Chromium for the browser tests
        run: pwsh tests/PromptManager.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: >
          dotnet test PromptManager.slnx --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;HtmlInline;Badges" -assemblyfilters:"+PromptManager" -classfilters:"-PromptManager.Migrations.*"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  docker:
    # Builds the image, starts it with PostgreSQL through compose.yaml and
    # checks that the app migrates and serves pages; nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait

      - name: Check the app responds
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://localhost:8080/health
          curl --silent --fail --output /dev/null http://localhost:8080/Prompts
          curl --silent --fail --output /dev/null http://localhost:8080/Runs

      - name: Logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes
