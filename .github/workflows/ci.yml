name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore PromptManager.slnx

      - name: Build
        run: dotnet build PromptManager.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test PromptManager.slnx --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  docker:
    # Builds the image and checks that the container starts and serves pages;
    # nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag prompt-manager:ci .

      - name: Start container and check it responds
        run: |
          docker run --detach --name pm --publish 8080:8080 prompt-manager:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:8080/health
          curl --silent --fail --output /dev/null http://localhost:8080/Prompts
          curl --silent --fail --output /dev/null http://localhost:8080/Runs

      - name: Container logs
        if: always()
        run: docker logs pm || true
